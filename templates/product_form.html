{% extends "base.html" %}{% block title %}{{ page_title }} · AQUAÉ{% endblock %}{% block content %}
<section class="page-head"><div><p class="eyebrow">INVENTORY / CATALOG</p><h1>{{ page_title }}</h1><p class="muted">Enter the product details below.</p></div><a class="text-link" href="{{ url_for('products') }}">← Back to products</a></section>
<section class="panel form-panel"><form method="post" class="product-form"><label>Product name<input name="product_name" required value="{{ product.product_name if product else '' }}"></label>
<label>Category<select name="category_id" required>{% for c in categories %}<option value="{{ c.category_id }}" {% if product and product.category_id == c.category_id %}selected{% endif %}>{{ c.category_name }}</option>{% endfor %}</select></label>
<div class="form-grid"><label>Price (THB)<input name="price" type="number" min="0" step="0.01" required value="{{ product.price if product else '' }}"></label><label>Stock quantity<input name="stock" type="number" min="0" step="1" required value="{{ product.stock if product else '0' }}"></label></div>
<label>Description<textarea name="description" rows="4">{{ product.description if product else '' }}</textarea></label><div class="form-actions"><button class="btn">Save product</button><a class="btn ghost" href="{{ url_for('products') }}">Cancel</a></div></form></section>{% endblock %}
